<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · ParentGuard</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><h1>🛡️ ParentGuard Admin</h1><div id="app"><div class="c">Connecting to Firebase…</div></div></main>
<script type="module">
import {auth,db,A,F,panel,J,esc,online,fbcfg} from './common.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const appEl=document.getElementById('app');
const secondaryApp=initializeApp(fbcfg,'parent-account-creator');
const secondaryAuth=getAuth(secondaryApp);
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(24))).map(x=>x.toString(16).padStart(2,'0')).join('');
function showLogin(note=''){
 appEl.innerHTML=`<section class="c login"><h2>Administrator sign in</h2>${note?`<p class="off">${esc(note)}</p>`:''}<label for="adminLoginEmail">Email address</label><input id="adminLoginEmail" type="email" autocomplete="username"><label for="adminLoginPassword">Password</label><input id="adminLoginPassword" type="password" autocomplete="current-password"><button id="adminLoginButton">Sign in</button><p id="loginMessage" role="status" aria-live="polite"></p><p><a href="setup.html">First-time administrator setup</a> · <a href="index.html">Home</a></p></section>`;
 const email=document.getElementById('adminLoginEmail'),password=document.getElementById('adminLoginPassword'),button=document.getElementById('adminLoginButton'),msg=document.getElementById('loginMessage');
 const go=async()=>{button.disabled=true;msg.textContent='Signing in…';try{await A.signInWithEmailAndPassword(auth,email.value.trim(),password.value)}catch(e){msg.className='off';msg.textContent=e.code||e.message;button.disabled=false}};
 button.addEventListener('click',go);password.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
let started=false,unsubParents=null,unsubDevices=null;
function stopListeners(){if(unsubParents)unsubParents();if(unsubDevices)unsubDevices();unsubParents=unsubDevices=null;}
A.onAuthStateChanged(auth,async user=>{
 stopListeners();started=false;
 if(!user||user.isAnonymous){showLogin();return;}
 appEl.innerHTML='<div class="c">Checking administrator access…</div>';
 try{
  const adminSnap=await F.getDoc(F.doc(db,'admins',user.uid));
  if(!adminSnap.exists()){await A.signOut(auth);showLogin('This Firebase account is not registered as a ParentGuard administrator. Complete first-time setup or ask the Super Admin to verify your account.');return;}
 }catch(error){showLogin('Could not verify administrator access: '+(error.code||error.message)+'. Check Firestore rules and project configuration.');return;}
 if(started)return;started=true;
 appEl.innerHTML=`<div class="c"><div class="row"><div><b>Administrator</b><div>${esc(user.email||'')}</div></div><button id="adminSignOut" class="gr">Sign out</button></div></div>
 <div class="tiles" id="overview"></div>
 <section class="c"><h2>Parent accounts</h2><div id="parentList">Loading…</div><div class="row"><input id="parentName" placeholder="Parent full name"><input id="parentEmail" type="email" placeholder="Parent email"><input id="parentPassword" type="password" placeholder="Temporary password (8+ characters)"><button id="createParent">Create parent login</button></div><p id="parentMessage" role="status"></p><small>Parent accounts are created in Firebase Authentication and linked to their parent profile. Share the temporary password securely.</small></section>
 <section class="c"><h2>Add child device</h2><div class="row"><input id="deviceName" placeholder="Child name / device name"><button id="addDevice">Add device</button></div><div id="deviceCredentials"></div></section>
 <h2>Child devices and controls</h2><div id="deviceList"></div>`;
 const $=id=>document.getElementById(id);
 $('adminSignOut').onclick=()=>A.signOut(auth);
 $('createParent').onclick=async()=>{const name=$('parentName').value.trim(),email=$('parentEmail').value.trim().toLowerCase(),password=$('parentPassword').value,msg=$('parentMessage'),btn=$('createParent');if(!name||!email||password.length<8){msg.className='off';msg.textContent='Enter parent name, valid email and password of at least 8 characters.';return;}btn.disabled=true;msg.textContent='Creating parent account…';try{const cred=await createUserWithEmailAndPassword(secondaryAuth,email,password);await F.setDoc(F.doc(db,'parents',cred.user.uid),{uid:cred.user.uid,name,email,accountType:'email-password',createdAt:new Date().toISOString()});await signOut(secondaryAuth);$('parentName').value=$('parentEmail').value=$('parentPassword').value='';msg.className='on';msg.textContent='Parent login created. The parent can sign in at parent.html.';}catch(e){msg.className='off';msg.textContent='Parent creation failed: '+(e.code||e.message)+'. If the account already exists, contact the administrator to reconcile it.';}finally{btn.disabled=false;}};
 const showCredentials=async(id,box)=>{const snap=await F.getDoc(F.doc(db,'deviceKeys',id));const value=JSON.stringify({projectId:fbcfg.projectId,apiKey:fbcfg.apiKey,deviceId:id,deviceKey:snap.data()?.key||''},null,2);box.innerHTML='<p>Copy this into the child PC as <code>agent/config.json</code>, then run <code>install.bat</code> as administrator.</p>';const area=document.createElement('textarea');area.rows=6;area.readOnly=true;area.value=value;const copy=document.createElement('button');copy.textContent='Copy configuration';copy.onclick=async()=>{try{await navigator.clipboard.writeText(value);copy.textContent='Copied ✓';}catch{area.select();document.execCommand('copy');copy.textContent='Copied';}};box.append(area,copy);};
 $('addDevice').onclick=async()=>{const name=$('deviceName').value.trim();if(!name)return;const btn=$('addDevice');btn.disabled=true;try{const ref=await F.addDoc(F.collection(db,'devices'),{name,parentId:'',cfg:'{}',adminCfg:'{}',status:'{}',createdAt:new Date().toISOString()});await F.setDoc(F.doc(db,'deviceKeys',ref.id),{key:rnd()});await showCredentials(ref.id,$('deviceCredentials'));$('deviceName').value='';}catch(e){$('deviceCredentials').textContent='Could not add device: '+(e.code||e.message);}finally{btn.disabled=false;}};
 let parents=[],devices=[];const cards=new Map();
 const drawOverview=()=>{$('overview').innerHTML=[['Parents',parents.length],['Children / devices',devices.length],['Online now',devices.filter(d=>online(J(d.data().status))).length],['Unassigned',devices.filter(d=>!d.data().parentId).length]].map(([label,value])=>`<div class="t"><small>${label}</small><b>${value}</b></div>`).join('');};
 const drawParents=()=>{$('parentList').innerHTML=parents.map(p=>`<div class="row parentrow" data-id="${esc(p.id)}"><b>${esc(p.name||'Unnamed parent')}</b><small>${esc(p.email||'No email')} · ${devices.filter(d=>d.data().parentId===p.id).length} child device(s)</small><button data-action="rename" class="gr">Rename</button></div>`).join('')||'<p>No parent accounts yet.</p>';for(const row of $('parentList').querySelectorAll('[data-id]')){row.querySelector('[data-action=rename]').onclick=async()=>{const p=parents.find(x=>x.id===row.dataset.id);const name=prompt('Parent name',p?.name||'');if(name?.trim())await F.updateDoc(F.doc(db,'parents',p.id),{name:name.trim()});};}};
 const buildDevice=(doc,data,wrap)=>{wrap.replaceChildren();const card=document.createElement('section');card.className='c';const title=document.createElement('h3');title.textContent=data.name||'Unnamed child';const row=document.createElement('div');row.className='row';const select=document.createElement('select');select.innerHTML='<option value="">Unassigned parent</option>'+parents.map(p=>`<option value="${esc(p.id)}">${esc(p.name||p.email||p.id)}</option>`).join('');select.value=data.parentId||'';select.onchange=()=>F.updateDoc(doc.ref,{parentId:select.value});const rename=document.createElement('button');rename.className='gr';rename.textContent='Rename';rename.onclick=async()=>{const name=prompt('Child/device name',data.name||'');if(name?.trim())await F.updateDoc(doc.ref,{name:name.trim()});};const creds=document.createElement('button');creds.className='gr';creds.textContent='Setup / credentials';const credentialBox=document.createElement('div');creds.onclick=()=>showCredentials(doc.id,credentialBox);const regen=document.createElement('button');regen.className='gr';regen.textContent='Regenerate device key';regen.onclick=async()=>{if(!confirm('Generate a new key? The agent currently installed on this device will be disconnected until you copy the new config.json to the PC and re-run install.bat.'))return;try{await F.setDoc(F.doc(db,'deviceKeys',doc.id),{key:rnd()});const agents=await F.getDocs(F.collection(db,'devices',doc.id,'agents'));await Promise.all(agents.docs.map(x=>F.deleteDoc(x.ref)));await showCredentials(doc.id,credentialBox);}catch(e){credentialBox.textContent='Could not regenerate key: '+(e.code||e.message);}};const del=document.createElement('button');del.className='dg';del.textContent='Delete device';del.onclick=async()=>{if(confirm('Delete this device and its key?')){const ag=await F.getDocs(F.collection(db,'devices',doc.id,'agents'));await Promise.all(ag.docs.map(x=>F.deleteDoc(x.ref)));await F.deleteDoc(F.doc(db,'deviceKeys',doc.id));await F.deleteDoc(doc.ref);}};row.append(select,rename,creds,regen,del);card.append(title,row,credentialBox);const controls=panel(doc.id,data,'admin',(cfg,adminCfg)=>F.updateDoc(doc.ref,{cfg:JSON.stringify(cfg),adminCfg:JSON.stringify(adminCfg||{})}));card.append(controls);wrap.append(card);return controls;};
 const drawDevices=()=>{const seen=new Set();for(const doc of devices){const data=doc.data();seen.add(doc.id);const sig=JSON.stringify([data.name,data.parentId,data.cfg,data.adminCfg,data.status,parents.map(p=>[p.id,p.name])]);let entry=cards.get(doc.id);if(entry&&entry.sig===sig){entry.panel.refresh(data);continue;}if(!entry){entry={wrap:document.createElement('div')};$('deviceList').append(entry.wrap);cards.set(doc.id,entry);}entry.panel=buildDevice(doc,data,entry.wrap);entry.sig=sig;}for(const [id,entry] of cards){if(!seen.has(id)){entry.wrap.remove();cards.delete(id);}}};
 unsubParents=F.onSnapshot(F.collection(db,'parents'),snap=>{parents=snap.docs.map(d=>({id:d.id,...d.data()}));drawParents();drawDevices();drawOverview();},e=>{$('parentList').textContent='Parent list error: '+(e.code||e.message);});
 unsubDevices=F.onSnapshot(F.collection(db,'devices'),snap=>{devices=snap.docs;drawDevices();drawOverview();},e=>{$('deviceList').textContent='Device list error: '+(e.code||e.message);});
});
</script></body></html>
