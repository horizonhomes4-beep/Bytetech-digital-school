<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Accounts</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="accounts-page">
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.jpg" alt="School logo" onerror="this.style.display='none'"><h1>School Accounts <span>Digital Access Card</span></h1></div>
    <span id="conn" class="conn off">Connecting…</span>
  </header>

  <section id="paymentDashboard" class="payment-dashboard hide"></section>

  <section class="stats">
    <div class="stat g"><small>Total amount collected</small><b id="tPaid">₦0</b></div>
    <div class="stat w"><small>Balance expected</small><b id="tBal">₦0</b></div>
    <div class="stat"><small>Students</small><b id="tCount">0</b></div>
  </section>

  <div class="panel"><input id="q" type="search" placeholder="Search student or course…"></div>
  <main id="list" class="grid"><div class="empty">Loading…</div></main>
</div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
let data = [];
const $ = id => document.getElementById(id);
let previousOverdueIds = new Set();

function toast(m) {
  const t = $("toast");
  if (!t) return;
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 5000);
}

function monitorPaymentClock() {
  if (!data.length) return;

  const currentOverdue = new Set(
    data.filter(s => paymentInfo(s).status === "overdue").map(s => s.id)
  );

  if (previousOverdueIds.size) {
    data
      .filter(s => currentOverdue.has(s.id) && !previousOverdueIds.has(s.id))
      .slice(0, 3)
      .forEach(s => toast(
        `⛔ ${s.name}: paid coverage has elapsed — full balance ${money(paymentInfo(s).balance)} required.`
      ));
  }

  previousOverdueIds = currentOverdue;
}

if (!studentsRef) {
  $("list").innerHTML = `<div class="empty">Not connected — fix config.js first (see the banner above).</div>`;
} else watchConnection($("conn"));

function renderPaymentDashboard() {
  const x = paymentAdminSummary(data);
  const box = $("paymentDashboard");
  if (!x.overdue && !x.reminders) {
    box.classList.add("hide");
    box.innerHTML = "";
    return;
  }
  box.classList.remove("hide");
  box.classList.toggle("danger", x.overdue > 0);
  box.innerHTML = `<div class="pd-head">
    <div><h3>💳 Payment attention</h3>
    <div style="color:var(--mu);font-size:.82rem">The payment monitor checks each student's fee against the months already completed.</div></div>
    <div class="pd-counts">
      ${x.overdue ? `<span class="pd-count danger">⛔ ${x.overdue} overdue</span>` : ""}
      ${x.reminders ? `<span class="pd-count warn">🔔 ${x.reminders} payment reminder${x.reminders === 1 ? "" : "s"}</span>` : ""}
    </div>
  </div>`;
}

function render() {
  const t = totals(data);
  $("tPaid").textContent = money(t.paid);
  $("tBal").textContent = money(t.bal);
  $("tCount").textContent = data.length;
  renderPaymentDashboard();

  const q = $("q").value.trim().toLowerCase();
  const rows = data.filter(s => (s.name + " " + s.course).toLowerCase().includes(q));

  $("list").innerHTML = rows.length ? rows.map(s => {
    const bal = balanceOf(s), pct = s.fee > 0 ? Math.min(100, s.paid / s.fee * 100) : 0;
    const p = paymentInfo(s);
    return `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <div><h3>${esc(s.name)}</h3><div class="course">${esc(s.course)}</div></div>
        <div class="payment-status-wrap">${paymentStatusIconHTML(s)}</div>
      </div>
      <div class="rows">
        <div><small>Start date</small><b>${fmtDate(s.start)}</b></div>
        <div><small>End date</small><b>${fmtDate(s.end)}</b></div>
        <div><small>Duration</small><b>${durMonths(s.start, s.end)} months</b></div>
        <div><small>Course fee</small><b>${money(s.fee)}</b></div>
        <div><small>Amount paid</small><b style="color:var(--ok)">${money(s.paid)}</b></div>
        <div><small>Balance remaining</small><b style="color:${bal ? "var(--warn)" : "var(--ok)"}">${money(bal)}</b></div>
      </div>
      ${p.valid && p.completedMonths > 0 ? `<div>
        <div style="display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--mu);margin-bottom:5px">
          <span>Payment covered</span><b>${p.coveredMonths.toFixed(1)} / ${p.totalMonths} months</b>
        </div>
        <div class="payment-progress"><i style="width:${Math.min(100,p.coveredMonths/p.totalMonths*100)}%"></i></div>
      </div>` : ""}
      <div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--mu)">Certificate</small>${certBadgeHTML(s)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="cds" data-end="${esc(s.end)}">${countdownHTML(s.end)}</div>
    </article>`;
  }).join("") : '<div class="empty">No students found.</div>';
}

if (studentsRef) studentsRef.on("value", sn => {
  const v = sn.val() || {};
  data = Object.entries(v).map(([id, s]) => ({ id, ...s })).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  render();
  if (!previousOverdueIds.size) {
    previousOverdueIds = new Set(
      data.filter(s => paymentInfo(s).status === "overdue").map(s => s.id)
    );
  }
}, err => { $("list").innerHTML = `<div class="empty">Could not load data: ${esc(err.message)}</div>`; });

$("q").addEventListener("input", render);

$("list").addEventListener("click", e => {
  const icon = e.target.closest("[data-payment-detail]");
  if (!icon) return;
  const s = data.find(x => x.id === icon.dataset.paymentDetail);
  if (!s) return;
  const old = document.getElementById("paymentDetailModal");
  if (old) old.remove();
  document.body.insertAdjacentHTML("beforeend", paymentDetailHTML(s));
});

document.addEventListener("click", e => {
  if (e.target.closest("[data-close-payment-detail]") || e.target.classList.contains("payment-detail-modal")) {
    document.getElementById("paymentDetailModal")?.remove();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("paymentDetailModal")?.remove();
});
setInterval(
  () => document.querySelectorAll(".cds").forEach(
    el => el.innerHTML = countdownHTML(el.dataset.end)
  ),
  1000
);

setInterval(() => {
  render();
  monitorPaymentClock();
}, 60000);
</script>
<script>
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (e.key === "F12") e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && ["u","s","c","x","a","p"].includes(e.key.toLowerCase())) e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener("copy", e => e.preventDefault());
document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
</script>
</body>
</html>
