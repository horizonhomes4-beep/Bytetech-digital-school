<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · Student Accounts</title>
<link rel="stylesheet" href="style.css">
<style>
/* Admin-only additions (style.css is untouched) */
.admin-page .wrap{position:relative}
select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
select:focus{outline:2px solid var(--pri);border-color:transparent}
select option{background:var(--card);color:var(--tx)}
.admin-page .form{margin:0}
.admin-page .panel>.form{padding:0;border:0;background:none}
.panel.editing-mode{border-color:var(--pri);box-shadow:0 0 0 3px #5b8cff2e}
.edit-banner{display:flex;align-items:center;gap:8px;background:#5b8cff1c;color:var(--pri);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:600;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--mu)}
.chip b{margin-left:4px;color:var(--tx)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}.chip.on b{color:#fff}
.admin-page table tbody tr.editing{background:#5b8cff18!important;outline:2px solid #5b8cff66;outline-offset:-2px}
.row-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.ok{background:var(--ok);color:#06281c}
.am-card{width:min(480px,100%);background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 30px 100px #0009;position:relative;animation:detailIn .2s ease-out;display:grid;gap:12px}
.am-card h2{font-size:1.2rem;padding-right:40px}
.am-card p{color:var(--mu);font-size:.86rem}
.am-link{display:flex;gap:8px}.am-link input{font-size:.8rem}
.am-actions{display:flex;gap:8px;flex-wrap:wrap}.am-actions .btn{flex:1 1 130px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.am-note{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.8rem;color:var(--mu)}
.am-note b{color:var(--tx)}
@media(max-width:700px){.row-acts{justify-content:flex-end}}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px #00000012}
.scard.editing{border-color:var(--pri);box-shadow:0 0 0 3px #5b8cff33}
.sc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sc-head h3{font-size:1.1rem}.sc-head .course{color:var(--pri);font-weight:600;font-size:.88rem}
.sc-cert{display:flex;justify-content:space-between;align-items:center}.sc-cert small{color:var(--mu)}
.sc-acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sc-acts .btn{min-height:46px;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.sc-acts .btn.wide{grid-column:1/-1}
.sc-acts .btn.edit{background:#5b8cff;color:#fff}
.sc-acts .btn.share{background:var(--ok);color:#06281c}
.sc-acts .btn.view{background:#7d68ff;color:#fff}
.sc-acts .btn.pay{background:#ffb84d;color:#3a2600}
.sc-acts .btn.del{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.sc-acts .btn:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:420px){.sgrid{grid-template-columns:1fr}}
</style>
</head>
<body class="admin-page">
<div id="app" class="wrap">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.jpg" alt="School logo" onerror="this.style.display='none'"><h1>Admin <span>Panel</span></h1></div>
    <div class="acts">
      <span id="conn" class="conn off">Connecting…</span>
      <button class="bell" id="bellBtn" title="Certificate requests" aria-label="Certificate requests">🔔<span id="bellDot" class="dot hide">0</span></button>
      <a class="btn sec sm" style="display:inline-flex;align-items:center;text-decoration:none" href="index.html" target="_blank" rel="noopener">View student page</a>
    </div>
  </header>

  <div id="reqPanel" class="reqPanel hide"></div>
  <section id="paymentDashboard" class="payment-dashboard hide"></section>

  <section class="stats">
    <div class="stat g"><small>Total collected</small><b id="tPaid">₦0</b></div>
    <div class="stat w"><small>Balance expected</small><b id="tBal">₦0</b></div>
    <div class="stat"><small>Students</small><b id="tCount">0</b></div>
  </section>

  <section class="panel" id="formPanel">
    <h3 id="formTitle" style="margin-bottom:12px">Add student</h3>
    <div id="editBanner" class="edit-banner hide"></div>
    <div class="form">
      <div><label for="name">Student name</label><input id="name" autocomplete="off"></div>
      <div><label for="course">Course registered</label><input id="course" autocomplete="off"></div>
      <div><label for="start">Start date</label><input id="start" type="date"></div>
      <div><label for="end">End date</label><input id="end" type="date"></div>
      <div><label for="fee">Course fee (₦)</label><input id="fee" type="number" min="0" step="any" inputmode="decimal"></div>
      <div><label for="paid">Amount paid (₦)</label><input id="paid" type="number" min="0" step="any" inputmode="decimal"></div>
      <div><label for="certEligible">Certificate — will issue after course?</label>
        <select id="certEligible"><option value="no">No</option><option value="yes">Yes</option></select>
      </div>
      <div><label for="certCollected">Certificate collected?</label>
        <select id="certCollected"><option value="no">Not collected</option><option value="yes">Collected</option></select>
      </div>
      <div class="acts"><button class="btn" id="save">Save</button><button class="btn sec hide" id="cancel">Cancel</button></div>
    </div>
  </section>

  <section class="panel">
    <input id="q" type="search" placeholder="Search students or courses…">
    <div class="chips" id="chips"></div>
  </section>

  <section id="list" class="sgrid"></section>
</div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const F = ["name", "course", "start", "end", "fee", "paid"];
let data = [], editId = null, requests = [], filter = "all";
let previousOverdueIds = new Set(), overdueSeeded = false;

function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ---------- Overdue notifications (single source, no duplicates) ---------- */
function checkNewOverdue() {
  const now = new Set(data.filter(s => paymentInfo(s).status === "overdue").map(s => s.id));
  if (overdueSeeded) {
    data.filter(s => now.has(s.id) && !previousOverdueIds.has(s.id)).slice(0, 3)
      .forEach(s => toast(`⛔ ${s.name} is now overdue. Full balance ${money(paymentInfo(s).balance)} is required.`));
  }
  previousOverdueIds = now;
  overdueSeeded = true;
}

function renderPaymentDashboard() {
  const x = paymentAdminSummary(data);
  const box = $("paymentDashboard");
  if (!x.overdue && !x.reminders) { box.classList.add("hide"); box.innerHTML = ""; return; }
  box.classList.remove("hide");
  box.classList.toggle("danger", x.overdue > 0);
  box.innerHTML = `<div class="pd-head">
    <div><h3>💳 Payment monitoring</h3>
    <div style="color:var(--mu);font-size:.82rem">Payment requirements are calculated automatically from each student's fee, start date and course duration.</div></div>
    <div class="pd-counts">
      ${x.overdue ? `<span class="pd-count danger">⛔ ${x.overdue} overdue — access should be suspended</span>` : ""}
      ${x.reminders ? `<span class="pd-count warn">🔔 ${x.reminders} payment reminder${x.reminders === 1 ? "" : "s"}</span>` : ""}
    </div>
  </div>`;
}

/* ---------- Connection / data ---------- */
function start() {
  if (!studentsRef) {
    $("list").innerHTML = `<div class="empty">Not connected — fix config.js first (see the banner above).</div>`;
    $("save").disabled = true; return;
  }
  watchConnection($("conn"));

  studentsRef.on("value", sn => {
    const v = sn.val() || {};
    data = Object.entries(v).map(([id, s]) => ({ id, ...s }))
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    // If the student being edited was deleted elsewhere, leave edit mode.
    if (editId && !data.some(x => x.id === editId)) { reset(); toast("The student you were editing was removed"); }
    render();
    checkNewOverdue();
  }, err => toast("Database error: " + err.message));

  // Payment status depends on the clock too, so recheck every minute.
  setInterval(() => { render(); checkNewOverdue(); }, 60000);

  certRequestsRef.on("value", sn => {
    const before = new Set(requests.map(r => r.id));
    requests = Object.entries(sn.val() || {}).map(([id, r]) => ({ id, ...r }));
    renderRequests();
    if (start.reqSeeded) requests.filter(r => !before.has(r.id)).forEach(r => toast(`🔔 ${r.name} requested a certificate`));
    start.reqSeeded = true;
  });
}

function renderRequests() {
  $("bellDot").textContent = requests.length;
  $("bellDot").classList.toggle("hide", requests.length === 0);
  $("reqPanel").innerHTML = requests.length
    ? requests.map(r => `<div class="reqItem"><div><b>${esc(r.name)}</b><br><small style="color:var(--mu)">${esc(r.course || "")}</small></div>
        <button class="btn sm sec" data-resolve="${esc(r.id)}" data-sid="${esc(r.studentId || "")}">Resolve</button></div>`).join("")
    : `<div class="empty">No pending certificate requests.</div>`;
  render();
}
$("bellBtn").onclick = e => { e.stopPropagation(); $("reqPanel").classList.toggle("hide"); };
$("reqPanel").addEventListener("click", e => {
  const b = e.target.closest("[data-resolve]"); if (!b) return;
  certRequestsRef.child(b.dataset.resolve).remove().then(() => toast("Request resolved")).catch(err => toast(err.message));
  if (b.dataset.sid) studentsRef.child(b.dataset.sid).update({ certRequested: false }).catch(() => {});
});

/* ---------- Table ---------- */
const FILTERS = [
  ["all", "All", () => true],
  ["overdue", "Overdue", s => paymentInfo(s).status === "overdue"],
  ["reminder", "Reminders", s => paymentInfo(s).status === "reminder"],
  ["balance", "Owing", s => balanceOf(s) > 0],
  ["cert", "Certificate requests", s => s.certEligible && s.certRequested && !s.certCollected]
];

function renderChips() {
  $("chips").innerHTML = FILTERS.map(([k, label, fn]) =>
    `<button type="button" class="chip ${filter === k ? "on" : ""}" data-f="${k}">${label}<b>${data.filter(fn).length}</b></button>`
  ).join("");
}
$("chips").addEventListener("click", e => {
  const c = e.target.closest("[data-f]"); if (!c) return;
  filter = c.dataset.f; render();
});

function render() {
  const t = totals(data);
  $("tPaid").textContent = money(t.paid);
  $("tBal").textContent = money(t.bal);
  $("tCount").textContent = data.length;
  renderPaymentDashboard();
  renderChips();

  const q = $("q").value.trim().toLowerCase();
  const fn = FILTERS.find(f => f[0] === filter)[2];
  const rows = data.filter(s => fn(s) && ((s.name || "") + " " + (s.course || "")).toLowerCase().includes(q));

  $("list").innerHTML = rows.length ? rows.map(s => `<article class="scard ${s.id === editId ? "editing" : ""}">
      <div class="sc-head">
        <div><h3>${esc(s.name)}</h3><div class="course">${esc(s.course)}</div></div>
        <div class="payment-status-wrap">${paymentStatusIconHTML(s)}</div>
      </div>
      <div class="rows">
        <div><small>Start date</small><b>${fmtDate(s.start)}</b></div>
        <div><small>End date</small><b>${fmtDate(s.end)}</b></div>
        <div><small>Duration</small><b>${durMonths(s.start, s.end)} months</b></div>
        <div><small>Course fee</small><b>${money(s.fee)}</b></div>
        <div><small>Amount paid</small><b style="color:var(--ok)">${money(s.paid)}</b></div>
        <div><small>Balance</small><b style="color:${balanceOf(s) ? "var(--warn)" : "var(--ok)"}">${money(balanceOf(s))}</b></div>
      </div>
      <div class="sc-cert"><small>Certificate</small>${certBadgeHTML(s)}</div>
      <div class="sc-acts">
        <button class="btn edit" data-e="${esc(s.id)}">✏️ Edit</button>
        <button class="btn pay" data-pay="${esc(s.id)}" ${balanceOf(s) ? "" : "disabled"}>💵 Add payment</button>
        <button class="btn view" data-view="${esc(s.id)}">👁 View card</button>
        <button class="btn share" data-share="${esc(s.id)}">🔗 Share link</button>
        <button class="btn del wide" data-d="${esc(s.id)}">🗑 Delete student</button>
      </div>
    </article>`).join("")
    : `<div class="empty">${data.length ? "No students match your search or filter." : "No students yet."}</div>`;
}
$("q").addEventListener("input", render);

/* ---------- Modals ---------- */
function closeModal() { const m = document.getElementById("adminModal"); if (m) m.remove(); }
function openModal(inner) {
  closeModal();
  document.body.insertAdjacentHTML("beforeend",
    `<div class="payment-detail-modal" id="adminModal" role="dialog" aria-modal="true"><div class="am-card">
      <button class="payment-detail-close" data-close-modal aria-label="Close">×</button>${inner}</div></div>`);
}

async function copyLink(text, inputEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (_) {
    try { inputEl.focus(); inputEl.select(); return document.execCommand("copy"); } catch (e) { return false; }
  }
}

function openShare(s) {
  const link = studentLinkFor(s.id);
  const msg = `Hello ${s.name}, this is your personal student account card for ${s.course}. It shows only your own fee and payment record. Please keep this link private: ${link}`;
  openModal(`
    <h2>Share ${esc(s.name)}'s card</h2>
    <p>This link opens <b>only ${esc(s.name)}'s</b> course, fee and payment record.</p>
    <div class="am-link"><input id="shareLink" readonly value="${esc(link)}"><button class="btn" id="copyShare">Copy</button></div>
    <div class="am-actions">
      <a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">WhatsApp</a>
      <a class="btn sec" target="_blank" rel="noopener" href="${esc(link)}">Open card</a>
      ${navigator.share ? `<button class="btn sec" id="nativeShare">More…</button>` : ""}
    </div>
    <div class="am-note"><b>Keep it private.</b> Anyone holding this link can see this student's record, so send it only to the student or their guardian.</div>`);
  $("shareLink").addEventListener("focus", e => e.target.select());
  $("copyShare").onclick = async () => toast((await copyLink(link, $("shareLink"))) ? "Link copied" : "Press and hold the link to copy");
  const ns = $("nativeShare");
  if (ns) ns.onclick = () => navigator.share({ title: "Student account card", text: msg, url: link }).catch(() => {});
}

function openPay(s) {
  const bal = balanceOf(s);
  openModal(`
    <h2>Record payment — ${esc(s.name)}</h2>
    <p>Fee ${money(s.fee)} · Paid ${money(s.paid)} · Balance <b style="color:var(--warn)">${money(bal)}</b></p>
    <div><label for="payAmt">Amount received (₦)</label><input id="payAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 20000"></div>
    <div class="am-actions">
      <button class="btn sec" id="payFull">Full balance</button>
      <button class="btn" id="paySave">Add payment</button>
    </div>`);
  $("payAmt").focus();
  $("payFull").onclick = () => { $("payAmt").value = bal; };
  $("paySave").onclick = () => {
    const amt = Number($("payAmt").value);
    if (!(amt > 0)) return toast("Enter an amount greater than zero");
    if (amt > bal) return toast(`That is more than the balance (${money(bal)})`);
    $("paySave").disabled = true;
    // Transaction keeps the total correct even if two admins record at once.
    studentsRef.child(s.id).child("paid").transaction(cur => Math.min(Number(s.fee || 0), Number(cur || 0) + amt))
      .then(() => { toast(`Recorded ${money(amt)} for ${s.name}`); closeModal(); })
      .catch(err => { toast("Error: " + err.message); $("paySave").disabled = false; });
  };
}

/* ---------- Click handling ---------- */
document.addEventListener("click", e => {
  if (!e.target.closest("#reqPanel") && !e.target.closest("#bellBtn")) $("reqPanel").classList.add("hide");
  if (e.target.closest("[data-close-payment-detail]") || e.target.classList.contains("payment-detail-modal")) {
    document.getElementById("paymentDetailModal")?.remove();
    closeModal();
  }
  if (e.target.closest("[data-close-modal]")) closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { document.getElementById("paymentDetailModal")?.remove(); closeModal(); }
});

$("list").addEventListener("click", e => {
  const icon = e.target.closest("[data-payment-detail]");
  if (icon) {
    const s = data.find(x => x.id === icon.dataset.paymentDetail); if (!s) return;
    document.getElementById("paymentDetailModal")?.remove();
    document.body.insertAdjacentHTML("beforeend", paymentDetailHTML(s));
    return;
  }
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const find = id => data.find(x => x.id === id);

  if (b.dataset.e) {
    const s = find(b.dataset.e); if (!s) return;
    F.forEach(k => $(k).value = s[k] ?? "");
    editId = s.id;
    $("certEligible").value = s.certEligible ? "yes" : "no";
    $("certCollected").value = s.certCollected ? "yes" : "no";
    $("formTitle").textContent = "Update student";
    $("editBanner").textContent = `✏️ Editing ${s.name}`;
    $("editBanner").classList.remove("hide");
    $("formPanel").classList.add("editing-mode");
    $("save").textContent = "Update"; $("cancel").classList.remove("hide");
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("name").focus({ preventScroll: true });
  } else if (b.dataset.d) {
    const s = find(b.dataset.d);
    if (s && confirm(`Delete ${s.name}? Their private link will stop working. This cannot be undone.`))
      studentsRef.child(s.id).remove().then(() => { toast("Deleted"); if (editId === s.id) reset(); }).catch(err => toast(err.message));
  } else if (b.dataset.share) {
    const s = find(b.dataset.share); if (s) openShare(s);
  } else if (b.dataset.view) {
    window.open(studentLinkFor(b.dataset.view), "_blank", "noopener");
  } else if (b.dataset.pay) {
    const s = find(b.dataset.pay); if (s) openPay(s);
  }
});

/* ---------- Form ---------- */
function reset() {
  F.forEach(k => $(k).value = ""); editId = null;
  $("certEligible").value = "no"; $("certCollected").value = "no";
  $("formTitle").textContent = "Add student"; $("save").textContent = "Save";
  $("cancel").classList.add("hide"); $("editBanner").classList.add("hide");
  $("formPanel").classList.remove("editing-mode");
  render();
}
$("cancel").onclick = reset;

$("save").onclick = () => {
  if (!studentsRef) return toast("Not connected to the database — fix config.js first.");
  const s = {}; F.forEach(k => s[k] = $(k).value.trim());
  if (!s.name || !s.course || !s.start || !s.end || s.fee === "" || s.paid === "") return toast("Fill in every field");
  s.fee = +s.fee; s.paid = +s.paid;
  if (isNaN(s.fee) || isNaN(s.paid)) return toast("Fee and amount paid must be numbers");
  if (s.end < s.start) return toast("End date must be after start date");
  if (s.fee < 0 || s.paid < 0) return toast("Amounts cannot be negative");
  if (s.paid > s.fee) return toast("Amount paid cannot exceed the fee");
  s.certEligible = $("certEligible").value === "yes";
  s.certCollected = $("certCollected").value === "yes";
  if (editId) {
    const cur = data.find(x => x.id === editId);
    s.certRequested = cur ? !!cur.certRequested && !s.certCollected : false;
  }
  const wasEdit = !!editId;
  const btn = $("save"); btn.disabled = true;
  const p = wasEdit ? studentsRef.child(editId).update(s) : studentsRef.push(s);
  p.then(() => { toast(wasEdit ? "Student updated" : "Student saved"); reset(); })
   .catch(err => toast("Error: " + err.message)).finally(() => btn.disabled = false);
};
document.querySelector(".form").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName === "INPUT") $("save").click();
});

start();
</script>
</body>
</html>
