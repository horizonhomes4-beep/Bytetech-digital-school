<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="max-width:520px">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.jpg" alt="School logo" onerror="this.style.display='none'"><h1>My Lesson<span>Digital Access Card</span></h1></div>
    <span id="conn" class="conn off">Connecting…</span>
  </header>
  <div id="body"><div class="empty">Loading…</div></div>
</div>
<div id="toast" class="toast"></div>

<!-- Personalised payment alert -->
<div id="paymentModal" class="student-payment-modal hide" role="dialog" aria-modal="true" aria-labelledby="paymentModalTitle">
  <div id="paymentDialog" class="student-payment-dialog">
    <div class="pd-title">
      <div id="paymentIcon" class="pd-icon">🔔</div>
      <div>
        <h2 id="paymentModalTitle">Payment reminder</h2>
        <p id="paymentModalText"></p>
      </div>
    </div>
    <div id="paymentModalGrid" class="pd-grid"></div>
    <div class="pd-actions">
      <button class="btn sec" id="closePaymentModal">I understand</button>
      <button class="btn" id="paymentAction">View my account</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get("id");

function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2500);
}

function openPaymentModal(s, force = false) {
  const p = paymentInfo(s);
  if (!p.valid || (p.status !== "overdue" && p.status !== "reminder")) return;

  // Overdue notices are intentionally repeatable: once payment coverage has
  // elapsed, remind the student every minute while this page remains open.
  // "Due soon" reminders are shown once per browser session.
  const key =
    `paymentNotice:${id}:${p.status}:${Math.round(p.balance)}:` +
    `${Math.round(p.enforcementStartMonths * 100)}`;

  if (p.status === "reminder" && !force && sessionStorage.getItem(key)) return;
  if (p.status === "reminder") sessionStorage.setItem(key, "1");

  const danger = p.status === "overdue";
  $("paymentDialog").className =
    `student-payment-dialog ${danger ? "danger" : "warn"}`;
  $("paymentIcon").textContent = danger ? "⛔" : "🔔";
  $("paymentModalTitle").textContent = danger
    ? `Payment required, ${s.name}`
    : `Payment coverage ending soon, ${s.name}`;

  $("paymentModalText").textContent = danger
    ? `Your paid course coverage has elapsed. Your lesson access is suspended until the full remaining balance is settled.`
    : `Your current payment is almost exhausted. Please settle the full remaining balance before your paid coverage ends.`;

  $("paymentModalGrid").innerHTML = `
    <div><small>Course fee</small><b>${money(p.fee)}</b></div>
    <div><small>Paid so far</small><b>${money(p.paid)}</b></div>
    <div><small>Full balance</small><b>${money(p.balance)}</b></div>
    <div><small>Payment covers</small><b>${p.coveredMonths.toFixed(2)} months</b></div>
    <div><small>Course time used</small><b>${p.elapsedMonths.toFixed(2)} months</b></div>
    <div><small>${danger ? "Pay to continue" : "Balance to settle"}</small><b>${money(p.balance)}</b></div>
  `;

  $("paymentAction").textContent = danger
    ? "Close & view account"
    : "View my account";
  $("paymentModal").classList.remove("hide");
}

function closePaymentModal() { $("paymentModal").classList.add("hide"); }
$("closePaymentModal").onclick = closePaymentModal;
$("paymentAction").onclick = closePaymentModal;
$("paymentModal").addEventListener("click", e => { if (e.target === $("paymentModal")) closePaymentModal(); });

if (CONFIG_ERROR) {
  // Banner from config.js already shown.
} else if (!id) {
  $("body").innerHTML = `<div class="empty">No student link provided. Ask the school office for your personal link.</div>`;
} else if (!studentsRef) {
  $("body").innerHTML = `<div class="empty">Not connected — check config.js.</div>`;
} else {
  watchConnection($("conn"));
  try { localStorage.setItem("studentAccountId", id); } catch (_) {}

  studentsRef.child(id).on("value", sn => {
    const s = sn.val();
    if (!s) {
      $("body").innerHTML = `<div class="empty">Student record not found. Ask the school office for a fresh link.</div>`;
      return;
    }
    window._lastEnd = s.end;
    window._lastStudent = s;
    render(s);
    openPaymentModal(s);
  }, err => {
    $("body").innerHTML = `<div class="empty">Could not load your record: ${esc(err.message)}</div>`;
  });
}

function render(s) {
  const bal = balanceOf(s), pct = s.fee > 0 ? Math.min(100, s.paid / s.fee * 100) : 0;
  const c = certStatus(s);
  const p = paymentInfo(s);

  let certAction = "";
  if (s.certEligible) {
    if (s.certCollected) certAction = `<div style="color:var(--ok);font-weight:600">🎓 Your certificate has been collected.</div>`;
    else if (s.certRequested) certAction = `<div style="color:var(--warn);font-weight:600">Request sent — awaiting the school office.</div>`;
    else certAction = `<button class="btn" id="reqBtn" style="width:100%">Request certificate</button>`;
  } else {
    certAction = `<div style="color:var(--mu)">A certificate is not applicable for this course.</div>`;
  }

  const accessHTML = p.valid
    ? `<div class="access-state ${p.accessAllowed ? "active" : "suspended"}">
        ${p.accessAllowed ? "✅ Lesson access: ACTIVE" : "⛔ Lesson access: SUSPENDED"}
        <div style="font-weight:400;margin-top:3px">${esc(p.message)}</div>
      </div>`
    : "";

  $("body").innerHTML = `<article class="card">
    <div>
      <h3>${esc(s.name)}</h3>
      <div class="course">${esc(s.course)}</div>
    </div>

    ${paymentNoticeHTML(s)}

    ${accessHTML}

    <div class="rows">
      <div><small>Start date</small><b>${fmtDate(s.start)}</b></div>
      <div><small>End date</small><b>${fmtDate(s.end)}</b></div>
      <div><small>Duration</small><b>${durMonths(s.start, s.end)} months</b></div>
      <div><small>Course fee</small><b>${money(s.fee)}</b></div>
      <div><small>Amount paid</small><b style="color:var(--ok)">${money(s.paid)}</b></div>
      <div><small>Balance remaining</small><b style="color:${bal ? "var(--warn)" : "var(--ok)"}">${money(bal)}</b></div>
    </div>

    ${p.valid ? `<div>
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--mu);margin-bottom:5px">
        <span>Fee paid</span><b>${p.paidPercent.toFixed(0)}%</b>
      </div>
      <div class="payment-progress"><i style="width:${p.paidPercent}%"></i></div>
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--mu);margin:8px 0 5px">
        <span>Payment coverage</span><b>${p.coveredMonths.toFixed(1)} / ${p.totalMonths} months</b>
      </div>
      <div class="payment-progress schedule"><i style="width:${Math.min(100,p.coveredMonths/p.totalMonths*100)}%"></i></div>
    </div>` : ""}

    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="cds" id="cds">${countdownHTML(s.end)}</div>

    <div class="certbox">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Certificate</b><span class="badge ${c.cls}">${c.label}</span></div>
      ${certAction}
    </div>
  </article>`;

  const rb = $("reqBtn");
  if (rb) rb.onclick = () => {
    rb.disabled = true; rb.textContent = "Sending…";
    Promise.all([
      certRequestsRef.push({ studentId: id, name: s.name, course: s.course, requestedAt: firebase.database.ServerValue.TIMESTAMP }),
      studentsRef.child(id).update({ certRequested: true })
    ]).then(() => toast("Request sent to the school office"))
      .catch(err => { toast("Error: " + err.message); rb.disabled = false; rb.textContent = "Request certificate"; });
  };
}

setInterval(() => {
  const el = $("cds");
  if (el && window._lastEnd) el.innerHTML = countdownHTML(window._lastEnd);

  // Recalculate from the device clock every minute. This catches the exact
  // point at which the payment-duration rule changes without a Firebase write.
  if (window._lastStudent) {
    const p = paymentInfo(window._lastStudent);

    if (p.status === "overdue") {
      render(window._lastStudent);
      openPaymentModal(window._lastStudent, true);
    } else if (p.status === "reminder") {
      render(window._lastStudent);
      openPaymentModal(window._lastStudent);
    } else {
      render(window._lastStudent);
    }
  }
}, 60000);
</script>
</body>
</html>
