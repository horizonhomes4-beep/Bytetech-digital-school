<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Accounts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.jpg" alt="School logo" onerror="this.style.display='none'"><h1>School <span>Accounts</span></h1></div>
    <span id="conn" class="conn off">Connecting…</span>
  </header>
  <section class="stats">
    <div class="stat g"><small>Total amount collected</small><b id="tPaid">₦0</b></div>
    <div class="stat w"><small>Balance expected</small><b id="tBal">₦0</b></div>
    <div class="stat"><small>Students</small><b id="tCount">0</b></div>
  </section>
  <div class="panel"><input id="q" type="search" placeholder="Search student or course…"></div>
  <main id="list" class="grid"><div class="empty">Loading…</div></main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
let data = [];
const $ = id => document.getElementById(id);
if (!studentsRef) { $("list").innerHTML = `<div class="empty">Not connected — fix config.js first (see the banner above).</div>`; }
else watchConnection($("conn"));

function render() {
  const t = totals(data);
  $("tPaid").textContent = money(t.paid);
  $("tBal").textContent = money(t.bal);
  $("tCount").textContent = data.length;
  const q = $("q").value.trim().toLowerCase();
  const rows = data.filter(s => (s.name + " " + s.course).toLowerCase().includes(q));
  $("list").innerHTML = rows.length ? rows.map(s => {
    const bal = balanceOf(s), pct = s.fee > 0 ? Math.min(100, s.paid / s.fee * 100) : 0;
    return `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
        <div><h3>${esc(s.name)}</h3><div class="course">${esc(s.course)}</div></div>
        <span class="badge ${bal ? "b-due" : "b-ok"}">${bal ? "Balance due" : "Paid in full"}</span>
      </div>
      <div class="rows">
        <div><small>Start date</small><b>${fmtDate(s.start)}</b></div>
        <div><small>End date</small><b>${fmtDate(s.end)}</b></div>
        <div><small>Duration</small><b>${durMonths(s.start, s.end)} months</b></div>
        <div><small>Course fee</small><b>${money(s.fee)}</b></div>
        <div><small>Amount paid</small><b style="color:var(--ok)">${money(s.paid)}</b></div>
        <div><small>Balance remaining</small><b style="color:${bal ? "var(--warn)" : "var(--ok)"}">${money(bal)}</b></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--mu)">Certificate</small>${certBadgeHTML(s)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="cds" data-end="${esc(s.end)}">${countdownHTML(s.end)}</div>
    </article>`;
  }).join("") : '<div class="empty">No students found.</div>';
}

if (studentsRef) studentsRef.on("value", sn => {
  const v = sn.val() || {};
  data = Object.entries(v).map(([id, s]) => ({ id, ...s })).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  render();
}, err => { $("list").innerHTML = `<div class="empty">Could not load data: ${esc(err.message)}</div>`; });

$("q").addEventListener("input", render);
setInterval(() => document.querySelectorAll(".cds").forEach(el => el.innerHTML = countdownHTML(el.dataset.end)), 1000);
</script>
  <script>
document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
});

document.addEventListener("keydown", function (e) {
    // F12
    if (e.key === "F12") {
        e.preventDefault();
    }

    // Ctrl/Cmd + common developer/copy shortcuts
    if (
        (e.ctrlKey || e.metaKey) &&
        ["u", "s", "c", "x", "a", "p"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }

    // Ctrl+Shift+I / J / C
    if (
        (e.ctrlKey || e.metaKey) &&
        e.shiftKey &&
        ["i", "j", "c"].includes(e.key.toLowerCase())
    ) {
        e.preventDefault();
    }
});

document.addEventListener("copy", function (e) {
    e.preventDefault();
});

document.addEventListener("cut", function (e) {
    e.preventDefault();
});

document.addEventListener("dragstart", function (e) {
    e.preventDefault();
});
</script>

</body>
</html>
